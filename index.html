<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081D33">
<title>雨の日だけの宝探し — Ver.3</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
 --navy:#0c2034;--navy2:#122d47;--glass:rgba(10,29,48,.82);
 --white:#fff;--muted:#a8bfd0;--cyan:#73d2ff;--gold:#ffd76a;--green:#84dfa5;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;background:#061522;color:#fff}
#app{max-width:460px;height:100dvh;margin:auto;position:relative;overflow:hidden;background:#0b1e31}
#map{position:absolute;inset:0 0 82px 0}
.leaflet-control-attribution{font-size:8px!important;background:rgba(255,255,255,.7)!important}
.top{
 position:absolute;z-index:1000;top:0;left:0;right:0;padding:12px;
 background:linear-gradient(180deg,rgba(5,18,31,.86),rgba(5,18,31,.25),transparent);
 pointer-events:none
}
.toprow{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.brand{font-weight:900;font-size:17px;letter-spacing:.01em;text-shadow:0 2px 10px #000}
.weatherBadge{
 pointer-events:auto;background:var(--glass);backdrop-filter:blur(12px);
 border:1px solid rgba(255,255,255,.12);padding:8px 10px;border-radius:15px;
 font-size:10px;color:#dcecf7;text-align:right;box-shadow:0 7px 18px rgba(0,0,0,.2)
}
.live{color:var(--cyan);font-weight:900}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#65d1ff;margin-right:5px;box-shadow:0 0 0 4px rgba(101,209,255,.14)}
.modebar{
 position:absolute;z-index:1002;left:50%;transform:translateX(-50%);top:72px;
 display:flex;background:rgba(8,25,42,.88);border:1px solid rgba(255,255,255,.14);
 padding:4px;border-radius:17px;box-shadow:0 6px 16px rgba(0,0,0,.22);backdrop-filter:blur(10px)
}
.modebar button{border:0;background:transparent;color:#bdd0df;padding:8px 13px;border-radius:13px;font-weight:800;font-size:11px}
.modebar button.active{background:#fff;color:#11304b}
.counter{
 position:absolute;z-index:1001;left:12px;top:120px;background:var(--glass);
 border:1px solid rgba(255,255,255,.12);border-radius:15px;padding:8px 10px;
 font-size:11px;box-shadow:0 6px 16px rgba(0,0,0,.18);backdrop-filter:blur(10px)
}
.locate,.keybtn{
 position:absolute;z-index:1001;right:14px;width:48px;height:48px;border:1px solid rgba(255,255,255,.22);
 border-radius:50%;background:rgba(10,31,51,.88);color:#fff;box-shadow:0 7px 20px rgba(0,0,0,.3);font-size:20px
}
.locate{bottom:104px}.keybtn{bottom:162px;font-size:17px}
.bottomnav{
 position:absolute;z-index:1100;left:0;right:0;bottom:0;height:82px;background:#081b2e;
 border-top:1px solid rgba(255,255,255,.09);display:grid;grid-template-columns:repeat(3,1fr);
 padding-bottom:env(safe-area-inset-bottom)
}
.bottomnav button{border:0;background:transparent;color:#7994a9;font-weight:800;font-size:10px}
.bottomnav button span{display:block;font-size:23px;margin-bottom:3px}
.bottomnav button.active{color:#7fd5ff}
.sheet{
 position:absolute;z-index:1050;left:10px;right:10px;bottom:92px;background:rgba(8,27,46,.91);
 border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:12px 14px;backdrop-filter:blur(14px);
 box-shadow:0 8px 25px rgba(0,0,0,.3)
}
.sheet b{font-size:13px}.sheet p{margin:3px 0 0;color:#a9bfce;font-size:10px;line-height:1.5}
.userDot{width:18px;height:18px;border-radius:50%;background:#58b8ff;border:4px solid #fff;box-shadow:0 0 0 5px rgba(88,184,255,.26),0 2px 8px #000}
.itemwrap{background:transparent;border:0}
.item{
 width:43px;height:43px;border-radius:50%;display:grid;place-items:center;font-size:23px;
 border:2px solid rgba(255,255,255,.9);box-shadow:0 7px 18px rgba(0,0,0,.32);animation:bob 2s ease-in-out infinite
}
.drop{background:#dff5ff}.chest{background:#ffedb3}.rare{background:#dff7df}@keyframes bob{50%{transform:translateY(-5px)}}
.citywrap{background:transparent;border:0}
.citymarker{
 min-width:76px;padding:7px 9px;border-radius:14px;background:rgba(7,29,49,.9);color:white;
 border:1px solid rgba(255,255,255,.22);box-shadow:0 5px 15px rgba(0,0,0,.25);font-size:10px;text-align:center
}
.citymarker.raining{background:rgba(28,99,155,.92);border-color:#80d2ff}
.citymarker b{display:block;font-size:11px}
.toast{
 position:absolute;z-index:2000;left:50%;bottom:105px;transform:translateX(-50%) translateY(15px);
 background:rgba(4,18,30,.95);border:1px solid rgba(255,255,255,.15);padding:11px 15px;border-radius:15px;
 white-space:nowrap;font-size:11px;opacity:0;transition:.2s;pointer-events:none
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{
 position:absolute;z-index:3000;inset:0;background:rgba(2,10,17,.78);display:none;align-items:center;justify-content:center;padding:22px
}
.modal.show{display:flex}
.modalbox{width:100%;background:#0e2942;border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:20px;box-shadow:0 20px 45px rgba(0,0,0,.45)}
.modalbox h2{font-size:18px;margin:0 0 8px}.modalbox p{font-size:11px;color:#b7cbd9;line-height:1.6}
.modalbox input{width:100%;border:1px solid #45627a;background:#071b2d;color:#fff;border-radius:14px;padding:13px;margin:8px 0;font-size:13px}
.actions{display:flex;gap:8px;margin-top:8px}.actions button{flex:1;border:0;border-radius:14px;padding:11px;font-weight:800}
.save{background:#79cef7;color:#092039}.cancel{background:#24435d;color:#fff}
.panel{
 position:absolute;z-index:1200;inset:0 0 82px 0;background:#071a2c;display:none;padding:86px 16px 18px;overflow:auto
}
.panel.show{display:block}
.panel h2{margin:0 0 15px}
.card{background:#0e2942;border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:16px;margin-bottom:12px}
.garden{text-align:center}.plant{font-size:85px;margin:15px}
.bar{height:9px;border-radius:10px;background:#203b51;overflow:hidden}.bar>div{height:100%;background:#78da9a;width:0%}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.mini{text-align:center}.mini .emoji{font-size:35px}

.rainlegend{
 position:absolute;z-index:1001;right:12px;top:120px;background:rgba(8,29,48,.88);
 border:1px solid rgba(255,255,255,.12);border-radius:15px;padding:9px 10px;
 font-size:10px;line-height:1.6;backdrop-filter:blur(10px);box-shadow:0 6px 16px rgba(0,0,0,.18)
}
.legendrow{display:flex;align-items:center;gap:6px}
.swatch{width:13px;height:13px;border-radius:4px;border:1px solid rgba(255,255,255,.35)}
.swatch.r1{background:rgba(80,180,255,.22)}
.swatch.r2{background:rgba(45,145,240,.38)}
.swatch.r3{background:rgba(20,95,210,.58)}
.swatch.dry{background:rgba(150,160,170,.07)}


.namebox{display:flex;gap:8px;margin-top:12px}
.namebox input{
 flex:1;border:1px solid rgba(255,255,255,.16);background:#071b2d;color:#fff;
 border-radius:12px;padding:10px 11px;font-size:12px;outline:none
}
.namebox button{
 border:0;border-radius:12px;padding:10px 13px;background:#79cef7;color:#092039;
 font-weight:800;font-size:11px
}
.plantname{font-weight:900;font-size:16px;margin-top:6px}

</style>
</head>
<body><div id="app">
<div id="map"></div>

<div class="top"><div class="toprow">
  <div class="brand">☔ 雨の日だけの宝探し</div>
  <div class="weatherBadge"><span class="dot"></span><span class="live">LIVE WEATHER</span><br><span id="radarState">サーバー接続待ち</span></div>
</div></div>

<div class="modebar">
  <button id="localBtn" class="active" onclick="setMode('local')">現在地</button>
  <button id="japanBtn" onclick="setMode('japan')">日本全国</button>
</div>

<div class="counter">💧 <span id="drops">0</span>　🎁 <span id="chests">0</span>　🌱 <span id="rares">0</span></div>

<div class="rainlegend" id="rainLegend">
 <div><b>推定雨エリア</b></div>
 <div class="legendrow"><span class="swatch r1"></span>弱い雨</div>
 <div class="legendrow"><span class="swatch r2"></span>雨</div>
 <div class="legendrow"><span class="swatch r3"></span>強い雨</div>
</div>


<button class="locate" onclick="goToMe()">◎</button>

<div class="sheet" id="sheet">
 <b id="status">位置情報を取得しています…</b>
 <p id="substatus">サーバー経由で各地点の現在の雨を判定します。</p>
</div>

<div class="toast" id="toast"></div>

<div id="gardenPanel" class="panel">
 <h2>GARDEN</h2>
 <div class="card garden">
 <div class="plantname" id="plantNameLabel">なまえ未設定</div>
 <div class="plant" id="plant">🌱</div>
 <div class="bar"><div id="growbar"></div></div>
 <p id="gardenText">最初は雨粒1個で成長。次は3個、その次は5個…と少しずつ必要数が増えます。</p>
 <div class="namebox">
   <input id="plantNameInput" maxlength="12" placeholder="植物に名前をつける">
   <button onclick="savePlantName()">決定</button>
 </div>
 </div>
</div>

<div id="collectionPanel" class="panel">
 <h2>COLLECTION</h2>
 <div class="grid">
  <div class="card mini"><div class="emoji">💧</div><b>雨粒</b><p><span id="cdrops">0</span> 個</p></div>
  <div class="card mini"><div class="emoji">🎁</div><b>宝箱</b><p><span id="cchests">0</span> 個</p></div>
  <div class="card mini"><div class="emoji">🌱</div><b>レア</b><p><span id="crares">0</span> 個</p></div>
  <div class="card mini"><div class="emoji">🎟️</div><b>クーポン</b><p><span id="coupons">0</span> 枚</p></div>
 </div>
</div>

<div class="bottomnav">
 <button class="active" id="mapNav" onclick="showPanel('map')"><span>🗺️</span>RAIN MAP</button>
 <button id="gardenNav" onclick="showPanel('garden')"><span>🌿</span>GARDEN</button>
 <button id="collectionNav" onclick="showPanel('collection')"><span>🎒</span>COLLECTION</button>
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const GET_DISTANCE=20;
let map,me,myLat=34.9858,myLng=135.7588;
const API_BASE='https://rain-treasure-api.ozaki-daichi-72u.workers.dev';
let weatherLayer=null, mode='local', localItems=[], nationalMarkers=[], rainCells=[], scanToken=0;
let counts=JSON.parse(localStorage.getItem('rainTreasureCounts')||'{"drop":0,"chest":0,"rare":0}');
let gardenLevel=0;
let plantName=localStorage.getItem('rainTreasurePlantName')||'';
const cities=[
 ['札幌',43.0618,141.3545],['仙台',38.2682,140.8694],['東京',35.6762,139.6503],
 ['横浜',35.4437,139.6380],['名古屋',35.1815,136.9066],['京都',35.0116,135.7681],
 ['大阪',34.6937,135.5023],['神戸',34.6901,135.1955],['広島',34.3853,132.4553],
 ['高松',34.3428,134.0466],['福岡',33.5902,130.4017],['鹿児島',31.5966,130.5571],['那覇',26.2124,127.6809]
];

function dist(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,p1=r(a),p2=r(c),dp=r(c-a),dl=r(d-b),h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function msg(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>x.classList.remove('show'),2200)}
function init(){
 map=L.map('map',{zoomControl:false}).setView([myLat,myLng],13);
 L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);
 setMe(myLat,myLng);
 connectWeather();
 syncCounts();
 renderPlantName();
 locate();
}
function setMe(lat,lng){
 myLat=lat;myLng=lng;
 const icon=L.divIcon({className:'',html:'<div class="userDot"></div>',iconSize:[18,18],iconAnchor:[9,9]});
 if(me)me.setLatLng([lat,lng]); else me=L.marker([lat,lng],{icon,zIndexOffset:1000}).addTo(map).bindTooltip('現在地');
}
function locate(){
 if(!navigator.geolocation){scanLocalArea();return}
 navigator.geolocation.getCurrentPosition(p=>{
   setMe(p.coords.latitude,p.coords.longitude); if(mode==='local')map.setView([myLat,myLng],13); scanLocalArea();
   navigator.geolocation.watchPosition(q=>setMe(q.coords.latitude,q.coords.longitude),()=>{}, {enableHighAccuracy:true,maximumAge:4000});
 },()=>{scanLocalArea();msg('位置情報を取得できないためデモ位置です');},{enableHighAccuracy:true,timeout:10000});
}
function connectWeather(){
 document.getElementById('radarState').textContent='現在天気データ接続中';
 if(mode==='japan')loadJapanStatus();
}
function clearDetailedWeather(){
 rainCells.forEach(x=>map.removeLayer(x));rainCells=[];
 localItems.forEach(x=>map.removeLayer(x.marker));localItems=[];
}
function rainInfo(j){
 const mm=Number((j.rain&&j.rain['1h'])||(j.rain&&j.rain['3h']?j.rain['3h']/3:0)||0);
 const main=(j.weather&&j.weather[0]&&j.weather[0].main)||'';
 const raining=['Rain','Drizzle','Thunderstorm'].includes(main)||mm>0;
 return {raining,mm};
}
function cellStyle(mm){
 if(mm>=4)return {fillColor:'#145fd2',fillOpacity:.58,color:'#60baff',weight:1};
 if(mm>=1)return {fillColor:'#2d91f0',fillOpacity:.38,color:'#79c8ff',weight:1};
 return {fillColor:'#50b4ff',fillOpacity:.22,color:'#9bd9ff',weight:1};
}
async function scanWeatherGrid(centerLat,centerLng,label='現在地周辺',gridN=5,step=.018){
 const token=++scanToken;
 clearDetailedWeather();
 document.getElementById('status').textContent=`${label}の雨を細かく確認中…`;
 document.getElementById('substatus').textContent='約2km間隔の地点を読み取り、雨エリアと宝物を配置しています。';

 const half=Math.floor(gridN/2), jobs=[];
 for(let iy=-half;iy<=half;iy++){
  for(let ix=-half;ix<=half;ix++){
   const lat=centerLat+iy*step, lng=centerLng+ix*step;
   jobs.push((async()=>{
    try{
     const r=await fetch(`${API_BASE}/weather?lat=${lat}&lon=${lng}`);
     if(!r.ok)throw new Error(r.status);
     const j=await r.json(), info=rainInfo(j);
     return {lat,lng,...info};
    }catch(e){return {lat,lng,raining:false,mm:0,error:true}}
   })());
  }
 }
 const cells=await Promise.all(jobs);
 if(token!==scanToken)return;

 let rainyCount=0,itemCount=0;
 for(const c of cells){
  if(!c.raining)continue;
  rainyCount++;
  const halfStep=step/2;
  const rect=L.rectangle(
   [[c.lat-halfStep,c.lng-halfStep],[c.lat+halfStep,c.lng+halfStep]],
   cellStyle(c.mm)
  ).addTo(map);
  rect.bindTooltip(`☔ ${c.mm?c.mm.toFixed(1)+' mm/h':'雨'}<br>宝物出現エリア`);
  rainCells.push(rect);

  // Each rainy ~2 km cell gets many walkable treasures.
  const n=c.mm>=4?8:c.mm>=1?6:4;
  for(let k=0;k<n;k++){
   const lat=c.lat+(Math.random()-.5)*step*.82;
   const lng=c.lng+(Math.random()-.5)*step*.82;
   const r=Math.random();
   const type=r<.58?'drop':r<.90?'chest':'rare';
   addItem(type,lat,lng);
   itemCount++;
  }
 }
 document.getElementById('status').textContent=
   rainyCount?`${label}：雨エリア ${rainyCount} 区画 / 宝物 ${itemCount} 個`:`${label}：現在、雨エリアは見つかりませんでした`;
 document.getElementById('substatus').textContent=
   rainyCount?'青い区画が現在の雨データから推定した雨エリアです。濃いほど雨が強く、宝物は雨区画内だけに出現します。':
   'この範囲では雨が検出されなかったため、宝物は出現していません。';
}
function scanLocalArea(){scanWeatherGrid(myLat,myLng,'現在地周辺',5,.018)}
function addItem(type,lat,lng){
 const e={drop:'💧',chest:'🎁',rare:'🌱'}[type];
 const icon=L.divIcon({className:'itemwrap',html:`<div class="item ${type}">${e}</div>`,iconSize:[43,43],iconAnchor:[21,21]});
 const marker=L.marker([lat,lng],{icon,zIndexOffset:600}).addTo(map);
 const o={type,lat,lng,marker,taken:false};localItems.push(o);marker.on('click',()=>take(o));
}
function take(o){
 if(o.taken)return;const d=Math.round(dist(myLat,myLng,o.lat,o.lng));
 if(d>GET_DISTANCE){msg(`あと ${d}m。近くまで歩いてみよう！`);return}
 o.taken=true;map.removeLayer(o.marker);counts[o.type]++;
 localStorage.setItem('rainTreasureCounts',JSON.stringify(counts));
 syncCounts();
 if(o.type==='chest')document.getElementById('coupons').textContent=counts.chest;
 if(o.type==='drop'){
   const growthPoints=[1,4,9,16,25];
   if(growthPoints.includes(counts.drop)){
     msg('雨粒をGET！ 植物が成長した！ 🌿');
   }else{
     const next=growthPoints.find(x=>x>counts.drop) || counts.drop+11;
     msg(`雨粒をGET！ あと ${next-counts.drop} 個で成長 💧`);
   }
 }else if(o.type==='chest'){
   msg('宝箱をGET！ クーポン入り 🎁');
 }else{
   msg('レアアイテムをGET！ 🌱');
 }
}
function syncCounts(){
 for(const k of ['drop','chest','rare']){
  document.getElementById(k==='drop'?'drops':k==='chest'?'chests':'rares').textContent=counts[k];
  document.getElementById(k==='drop'?'cdrops':k==='chest'?'cchests':'crares').textContent=counts[k];
 }
 document.getElementById('coupons').textContent=counts.chest;

 const thresholds=[0,1,4,9,16,25];
 const plants=['🌱','🪴','🌿','🌳','🌸','🌺'];

 gardenLevel=0;
 for(let i=1;i<thresholds.length;i++){
   if(counts.drop>=thresholds[i]) gardenLevel=i;
 }
 document.getElementById('plant').textContent=plants[gardenLevel];

 let nextTarget=null;
 for(let i=1;i<thresholds.length;i++){
   if(counts.drop<thresholds[i]){nextTarget=thresholds[i];break}
 }
 if(nextTarget===null){
   nextTarget=thresholds[thresholds.length-1]+11;
 }
 const need=nextTarget-counts.drop;
 const prevTarget=thresholds[Math.min(gardenLevel,thresholds.length-1)];
 const range=nextTarget-prevTarget;
 const progressed=Math.max(0,counts.drop-prevTarget);
 const pct=Math.min(100,(progressed/range)*100);
 document.getElementById('growbar').style.width=pct+'%';

 const name=plantName||'この植物';
 if(counts.drop===0){
   document.getElementById('gardenText').textContent=
     `${name}はまだ芽が出たばかり。最初の雨粒1個で成長します。`;
 }else{
   document.getElementById('gardenText').textContent=
     `${name}：雨粒 ${counts.drop} 個。あと ${need} 個で次の成長！`;
 }
}function setMode(m){
 mode=m;
 document.getElementById('localBtn').classList.toggle('active',m==='local');
 document.getElementById('japanBtn').classList.toggle('active',m==='japan');
 if(m==='japan'){
  clearDetailedWeather();
  map.flyTo([36.2,138.2],5,{duration:.8});
  document.getElementById('status').textContent='日本全国の雨の入口';
  document.getElementById('substatus').textContent='雨の都市をタップすると、街レベルの雨エリアと宝物まで拡大します。';
  loadJapanStatus();
 }else{
  nationalMarkers.forEach(x=>map.removeLayer(x));nationalMarkers=[];
  map.flyTo([myLat,myLng],13,{duration:.8});
  scanLocalArea();
 }
}
async function loadJapanStatus(){
 nationalMarkers.forEach(x=>map.removeLayer(x));nationalMarkers=[];

 document.getElementById('substatus').textContent='主要都市の現在の降水状況を取得中…';
 const jobs=cities.map(async c=>{
  try{
   const r=await fetch(`${API_BASE}/weather?lat=${c[1]}&lon=${c[2]}`);
   if(!r.ok)throw new Error(r.status);
   const j=await r.json();
   const main=(j.weather&&j.weather[0]&&j.weather[0].main)||'';
   const raining=['Rain','Drizzle','Thunderstorm'].includes(main)||!!j.rain;
   addCity(c[0],c[1],c[2],raining);
  }catch(e){addCity(c[0],c[1],c[2],null)}
 });
 await Promise.all(jobs);
 document.getElementById('substatus').textContent='☔の都市をタップすると街までズームし、雨区画と宝物を細かく表示します。';
}
function addCity(name,lat,lng,raining){
 const text=raining?`<b>☔ ${name}</b>雨エリアあり`:`<b>${name}</b>${raining===false?'☀️ 雨なし':'… 確認待ち'}`;
 const icon=L.divIcon({className:'citywrap',html:`<div class="citymarker ${raining?'raining':''}">${text}</div>`,iconSize:[82,40],iconAnchor:[41,20]});
 const m=L.marker([lat,lng],{icon,interactive:true}).addTo(map);nationalMarkers.push(m);
 m.on('click',()=>{
   if(!raining){msg(`${name}：現在は雨が検出されていません`);return}
   nationalMarkers.forEach(x=>map.removeLayer(x));nationalMarkers=[];
   map.flyTo([lat,lng],11,{duration:.8});
   scanWeatherGrid(lat,lng,name,5,.022);
 });
}
function goToMe(){setMode('local');map.flyTo([myLat,myLng],14,{duration:.7});setTimeout(scanLocalArea,800)}

function renderPlantName(){
 const label=document.getElementById('plantNameLabel');
 const input=document.getElementById('plantNameInput');
 if(label)label.textContent=plantName||'なまえ未設定';
 if(input)input.value=plantName;
}
function savePlantName(){
 const input=document.getElementById('plantNameInput');
 const v=(input.value||'').trim();
 if(!v){msg('名前を入力してね');return}
 plantName=v;
 localStorage.setItem('rainTreasurePlantName',plantName);
 renderPlantName();
 syncCounts();
 msg(`${plantName} と名付けました 🌱`);
}

function showPanel(p){
 document.getElementById('gardenPanel').classList.toggle('show',p==='garden');
 document.getElementById('collectionPanel').classList.toggle('show',p==='collection');
 document.getElementById('mapNav').classList.toggle('active',p==='map');
 document.getElementById('gardenNav').classList.toggle('active',p==='garden');
 document.getElementById('collectionNav').classList.toggle('active',p==='collection');
}
init();
</script></body></html>
